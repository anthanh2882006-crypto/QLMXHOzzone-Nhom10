<div class="oz-attachment-filters" data-attachment-filters hidden>
    <label>Tìm tệp <input type="search" data-attachment-query maxlength="150" placeholder="Tên tệp hoặc người gửi"></label>
    <label>Loại tệp
        <select data-attachment-type>
            <option value="">Tất cả</option>
            <option value="image">Ảnh</option>
            <option value="pdf">PDF</option>
            <option value="other">Tài liệu khác</option>
        </select>
    </label>
    <p data-attachment-no-match role="status" hidden>Không có tệp phù hợp.</p>
</div>
