<dialog id="oz-confirm-dialog" class="oz-confirm-dialog" aria-labelledby="oz-confirm-title" aria-describedby="oz-confirm-message">
  <h2 id="oz-confirm-title">Xác nhận thao tác</h2>
  <p id="oz-confirm-message"></p>
  <div class="oz-confirm-actions">
    <button type="button" data-confirm-cancel autofocus>Quay lại</button>
    <button type="button" data-confirm-accept>Xác nhận</button>
  </div>
</dialog>
