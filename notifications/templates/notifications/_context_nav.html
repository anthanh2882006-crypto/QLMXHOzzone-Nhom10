    <nav>
        <a class="{% if notice_nav_active == 'feed' %}is-active{% endif %}" href="{% url 'social:feed' %}">Bảng tin công ty</a>

        <a href="{% url 'social:saved' %}">Nội dung đã lưu</a>

    <div class="oz-notice-context-user">
        <span>Đang dùng tài khoản</span>
