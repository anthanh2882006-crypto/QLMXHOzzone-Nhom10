<div class="pm-field{% if field.field.widget.input_type == 'checkbox' %} pm-check{% endif %}"
     data-field="{{ field.name }}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required %}
            *
        {% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <small>{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <div class="pm-error" role="alert">{{ field.errors }}</div>
    {% endif %}
</div>
